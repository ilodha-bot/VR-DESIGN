<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kundam Market Redevelopment | VR Architectural Review</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Architectural Glassmorphism Styling */
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .glass-dock {
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .glass-button {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-button:hover, .glass-button.active {
      background: rgba(194, 109, 56, 0.35);
      border-color: #c26d38;
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 2px; }

    /* VR Comfort Vignette Overlay */
    #vignette-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      box-shadow: inset 0 0 140px rgba(0,0,0,0.9);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
  </style>
</head>
<body class="text-slate-100 antialiased select-none">

  <!-- 3D Canvas Container -->
  <div id="canvas-container" class="absolute inset-0 w-full h-full z-0"></div>

  <!-- Locomotion Vignette Overlay -->
  <div id="vignette-overlay"></div>

  <!-- 1. TOP STATUS BAR (DIRECT ACCESS) -->
  <header id="top-bar" class="absolute top-4 left-4 right-4 flex justify-between items-center z-20 pointer-events-none">
    <div class="glass-panel px-4 py-2.5 rounded-xl flex items-center gap-3 pointer-events-auto">
      <div class="w-3 h-3 rounded-full bg-amber-500 animate-pulse"></div>
      <div>
        <h1 class="text-xs font-bold tracking-widest uppercase text-slate-200">Kundam Market Redevelopment</h1>
        <p class="text-[10px] text-slate-400 font-mono">ARCHITECTURAL VR REVIEW PLATFORM</p>
      </div>
    </div>

    <!-- Mode Switcher, Controls & WebXR Trigger -->
    <div class="glass-panel px-3 py-1.5 rounded-xl flex items-center gap-2 pointer-events-auto">
      <button id="engine-toggle-btn" onclick="toggleEngineMode()" class="glass-button px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2">
        <i data-lucide="box" class="w-3.5 h-3.5"></i>
        <span>Engine: <strong class="text-amber-500">3D Walkthrough</strong></span>
      </button>

      <div class="h-4 w-px bg-slate-700"></div>

      <button onclick="toggleDaytime()" class="glass-button p-2 rounded-lg text-xs" title="Toggle Daylight / Night">
        <i data-lucide="sun" class="w-4 h-4 text-amber-400"></i>
      </button>

      <button onclick="openGoogleMapsModal()" class="glass-button px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
        <i data-lucide="map-pin" class="w-3.5 h-3.5 text-amber-400"></i>
        <span>Site Street View</span>
      </button>

      <div class="h-4 w-px bg-slate-700"></div>

      <!-- DIRECT VR ENTRY BUTTON -->
      <button onclick="requestVR()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs px-4 py-2 rounded-lg flex items-center gap-2 shadow-lg transition-all cursor-pointer">
        <i data-lucide="glasses" class="w-4 h-4"></i>
        <span>ENTER VR (META QUEST)</span>
      </button>
    </div>
  </header>

  <!-- 2. BOTTOM-LEFT PERSISTENT KEY PLAN HUD -->
  <div id="key-plan-hud" class="fixed bottom-24 left-6 z-20 glass-panel rounded-2xl p-3 w-56 border border-slate-700/80 shadow-2xl">
    <div class="flex items-center justify-between mb-2 pb-1 border-b border-slate-800">
      <div class="flex items-center gap-1.5">
        <i data-lucide="compass" class="w-3.5 h-3.5 text-amber-500"></i>
        <span class="text-[10px] font-bold tracking-wider text-slate-300 uppercase">KEY PLAN</span>
      </div>
      <span id="key-plan-zone-label" class="text-[9px] font-mono text-amber-400 font-medium">Entrance Plaza</span>
    </div>

    <!-- Mini Key Plan Canvas -->
    <div class="relative w-full h-36 bg-slate-950 rounded-lg overflow-hidden border border-slate-800 cursor-pointer" onclick="togglePanel('map')">
      <canvas id="key-plan-canvas" class="w-full h-full"></canvas>
      <div class="absolute bottom-1 right-1 bg-slate-900/90 text-[8px] font-mono px-1.5 py-0.5 rounded text-slate-400">
        CLICK TO EXPAND MAP
      </div>
    </div>
  </div>

  <!-- 3. BOTTOM FLOATING SPATIAL CONTROL DOCK -->
  <nav id="main-dock" class="
