 vent:{t:'Natural ventilation strategy',d:'Blue arrows show cross-ventilation entering at the façade. Orange arrows show warm air leaving through the stacks.'}};
const MATS=[['Compressed stabilised earth blocks (CSEB)','Low-carbon walls made from local soil, with high thermal mass.'],['Treated bamboo trusses','Lightweight, renewable roof structure spanning the halls.'],['Terracotta louvers','Shade the façade and let air pass through.'],['Lime plaster, reclaimed timber (placeholder)','Breathable finishes. Confirm with the architect’s schedule.']];
const LN={structure:'Structural elements',canopy:'Canopies',stalls:'Vendor stalls',massing:'Building massing',roof:'Roof structures',circ:'Circulation spaces',louvers:'Terracotta louvers'};
const A={
 mz(v){const k=v>0?.8:1.25;vb=[vb[0]+vb[2]*(1-k)/2,vb[1]+vb[3]*(1-k)/2,vb[2]*k,vb[3]*k];$('#mp').setAttribute('viewBox',vb.join(' '))},msite(){site=!site;vb=null;pn()},
 home(){fx=null;applyFx();cur=-1;vis();setMode('orbit');ui()},
 fl(i){cur=+i;vb=null;if(cur>1)toast('Floors 2–4: provisional layout (no plan supplied yet)');vis();$('#fp').classList.remove('o');if(mode==='orbit')floorView();else if(mode==='walk'){fade(()=>camera.position.y=fy()+1.6)}else showPano();pn()},
 prev(){A.fl(Math.max(-1,cur-1))},next(){A.fl(Math.min(4,cur+1))},
 fx(k){fx=fx===k?null:k;applyFx();if(fx==='zone'&&cur>=0&&0){}vis();pn()},
 lay(k){L[k]=!L[k];vis();pn()},
 view(k){setMode('orbit');go(...VIEW[k]);if(k==='plan')toast('Plan view')},
 tp(i){if(cur<0)A.fl(0);const z=LAY[cur][+i];stand(z.x,z.z,Math.atan2(z.x,z.z));toast(z.n+(z.prov?' (provisional layout)':''))},
 tpc(){if(cur<0)A.fl(0);stand(2,-10,-Math.PI/2);toast('Courtyard edge')},
 walk(){if(mode==='walk')return setMode('orbit');if(cur<0)A.fl(0);stand(-5,15,0);toast('Walk: WASD / arrows, drag to look')},
 pano(){if(cur<0)A.fl(0);fade(()=>{camera.position.set(0,fy()+1.6,0);yaw=0;pitch=0;setMode('pano');showPano()});toast('360° view · drag to look')},
 set(k,v){S[k]=k==='seated'?v==='1':k==='snap'?+v:!S.vig;pn()}
};
function applyFx(){mat.stack.emissiveIntensity=fx==='stack'||fx==='vent'?.9:0;mat.plant.emissiveIntensity=fx==='court'?.8:0;pads.forEach(p=>p.material.opacity=fx==='zone'?.7:.2)}
function sunUpdate(){const a=(S.h-6)/12*Math.PI;sun.position.set(Math.cos(a)*70,Math.sin(a)*70+4,25);sun.intensity=Math.max(.05,Math.sin(a))*1.5;hemi.intensity=S.dl;lightG.material.opacity=.08+Math.sin(a)*.2}
/* ===== Panels ===== */
let pnl=null;
const R={
 menu:()=>`<h3>Sustainability</h3>`+Object.entries(FX).map(([k,v])=>`<button class="row ${fx===k?'on':''}" data-a="fx:${k}">${v.t}</button>`).join('')+(fx?`<p>${FX[fx].d}</p>`:'')+`<label>Sun position<input type="range" min="6" max="18" step=".25" value="${S.h}" data-r="h"></label><label>Daylight level<input type="range" min=".2" max="1.6" step=".05" value="${S.dl}" data-r="dl"></label>`,
 map:()=>`<h3>${cur<0?FL[0]:FL[cur]}${(cur<0?0:cur)>1?' · provisional layout':''}</h3><div style="display:flex;gap:6px;margin-bottom:6px"><button class="row" data-a="mz:1" style="width:auto">＋</button><button class="row" data-a="mz:-1" style="width:auto">－</button><button class="row ${site?'on':''}" data-a="msite" style="width:auto">Site zoning</button></div><svg id="mp" style="width:100%;height:300px;border-radius:8px;touch-action:none;cursor:crosshair"></svg><p>${(cur<0?0:cur)>1?'No architect’s plan supplied for this floor yet. Zones are placeholders. ':''}Drag to pan, scroll to zoom, click a zone to teleport.</p>`,
 tele:()=>`<h3>Teleport · ${cur<0?FL[0]:FL[cur]}</h3>`+LAY[cur<0?0:cur].map((z,i)=>`<button class="row" data-a="tp:${i}"><span class="sw" style="background:${z.col}"></span>${z.n}</button>`).join('')+`<button class="row" data-a="tpc">Courtyard edge</button><button class="row" data-a="pano">360° render of this floor</button>`,
 set:()=>`<h3>Settings and VR comfort</h3><label>Viewing mode<select data-s="seated" style="width:100%;padding:6px;background:#1a1d20;color:#fff;border:1px solid var(--l);border-radius:6px"><option value="0" ${S.seated?'':'selected'}>Standing</option><option value="1" ${S.seated?'selected':''}>Seated</option></select></label><label>Snap turn<select data-s="snap" style="width:100%;padding:6px;background:#1a1d20;color:#fff;border:1px solid var(--l);border-radius:6px"><option ${S.snap==30?'selected':''}>30</option><option ${S.snap==45?'selected':''}>45</option></select></label><label class="ck"><input type="checkbox" data-s="vig" ${S.vig?'checked':''}>Comfort vignette and fade on moves</label><p>VR uses teleport only. There is no continuous movement.</p>`,
 info:()=>`<h3>Kundam Market</h3><p>Ground and First Floor follow the architect’s drawings (Community Design Studio). The site boundary, building footprint, courtyard, entrances and roads follow SITE ZONING. Dimensions were traced from the drawings, so expect ±1–2 m. Floor heights (4 m) and Second to Fourth Floors are provisional assumptions.</p><p>For 360° renders, save 2:1 equirectangular JPGs as <b>panos/floor-0.jpg</b> to <b>floor-4.jpg</b>.</p>`,
 lay:()=>`<h3>Layers</h3>`+Object.entries(LN).map(([k,v])=>`<label class="ck"><input type="checkbox" data-a="lay:${k}" ${L[k]?'checked':''}>${v}</label>`).join('')+`<h4>Materials</h4>`+MATS.map(m=>`<p><b style="color:var(--t)">${m[0]}</b><br>${m[1]}</p>`).join(''),
 cam:()=>`<h3>Camera</h3>`+[['aerial','Aerial perspective'],['elev','Front elevation'],['plan','Plan view']].map(v=>`<button class="row" data-a="view:${v[0]}">${v[1]}</button>`).join('')+`<button class="row" data-a="walk">Eye-level walk</button><button class="row" data-a="pano">360° render</button>`,
 help:()=>`<h3>Navigation</h3><p><b style="color:var(--t)">Orbit:</b> drag to rotate, scroll or pinch to zoom, right-drag to pan.</p><p><b style="color:var(--t)">Walk:</b> WASD or arrow keys, drag to look. Use Teleport to jump between zones.</p><p><b style="color:var(--t)">Floors:</b> ☰ at top right, or the floor dropdown.</p><p><b style="color:var(--t)">VR (Meta Quest):</b> open this page in the Quest browser and press Enter VR. Point and squeeze the trigger to teleport. Flick the thumbstick sideways to snap turn.</p>`
};
const DK=[['HOME','home'],['MENU','menu'],['MAP','map'],['TELEPORT','tele'],['WALK','walk'],['SETTINGS','set'],['INFO','info'],['LAYERS','lay'],['CAMERA','cam'],['HELP','help']];
$('#dk').innerHTML=DK.map(d=>`<button data-d="${d[1]}">${d[0]}</button>`).join('')+'<span id="vr"></span>';
$('#vr').appendChild(VRButton.createButton(renderer));
function pn(){const p=$('#pn');if(!pnl){p.classList.remove('o');return ui()}p.innerHTML=R[pnl]();p.classList.add('o');if(pnl==='map')mapInit();ui()}
function ui(){document.querySelectorAll('#dk [data-d]').forEach(b=>b.classList.toggle('on',b.dataset.d===pnl||(b.dataset.d==='walk'&&mode==='walk')))}
document.addEventListener('click',e=>{
 if(e.target.closest('#hb')){$('#fp').classList.toggle('o');return}
 const d=e.target.closest('[data-d]');if(d){const k=d.dataset.d;if(k==='home'){pnl=null;A.home();return pn()}if(k==='walk'){A.walk();return ui()}pnl=pnl===k?null:k;return pn()}
 const a=e.target.closest('[data-a]');if(a){const[f,v]=a.dataset.a.split(':');A[f](v)}});
document.addEventListener('input',e=>{const r=e.target.dataset.r;if(r){S[r]=+e.target.value;sunUpdate()}});
document.addEventListener('change',e=>{const s=e.target.dataset.s;if(s)A.set(s,e.target.type==='checkbox'?0:e.target.value)});


let site=false,vb=null;
function mapInit(){const f=cur<0?0:cur,P=site?SZ:PL[f],s=$('#mp');vb=vb||(site?[-53,-61,147,136]:[-45,-50,90,100]);const set=()=>s.setAttribute('viewBox',vb.join(' '));set();
 s.innerHTML='<rect x="-300" y="-300" width="600" height="600" fill="#f4f2ee"/>'+(P?`<image href="${P.img}" x="${P.x}" y="${P.z}" width="${P.w}" height="${P.h}" preserveAspectRatio="none"/>`:'')+`<polygon points="${FOOT.join(' ')}" fill="${P?'none':'#ddd'}" stroke="#b33" stroke-width=".4"/>`+(site?'':LAY[f].map(z=>`<rect x="${z.x-z.w/2}" y="${z.z-z.d/2}" width="${z.w}" height="${z.d}" fill="${z.col}" fill-opacity=".22" stroke="${z.col}" stroke-width=".3"/><text x="${z.x}" y="${z.z}" font-size="2.3" text-anchor="middle" fill="#222" paint-order="stroke" stroke="#fff" stroke-width=".5">${z.n}</text>`).join(''))+'<line id="ml" stroke="#c9a66b" stroke-width=".8"/><circle id="md" r="1.5" fill="#c9a66b" stroke="#000" stroke-width=".4"/>';
 let d0=null,mv=0;s.onpointerdown=e=>{d0=[e.clientX,e.clientY];mv=0;s.setPointerCapture(e.pointerId)};
 s.onpointermove=e=>{if(!d0)return;const k=1/s.getScreenCTM().a;mv+=Math.abs(e.clientX-d0[0])+Math.abs(e.clientY-d0[1]);vb[0]-=(e.clientX-d0[0])*k;vb[1]-=(e.clientY-d0[1])*k;d0=[e.clientX,e.clientY];set()};
 s.onpointerup=e=>{d0=null;if(mv<6&&!site){const q=s.createSVGPoint();q.x=e.clientX;q.y=e.clientY;const m=q.matrixTransform(s.getScreenCTM().inverse()),i=LAY[f].findIndex(z=>Math.abs(m.x-z.x)<z.w/2&&Math.abs(m.y-z.z)<z.d/2);if(i>=0)A.tp(i)}};
 s.onwheel=e=>{e.preventDefault();A.mz(e.deltaY<0?1:-1)};drawMap()}
function drawMap(){const d=$('#md');if(!d)return;const p=mode==='orbit'?controls.target:camera.position,l=$('#ml'),o=mode==='orbit'?0:5;d.setAttribute('cx',p.x);d.setAttribute('cy',p.z);l.setAttribute('x1',p.x);l.setAttribute('y1',p.z);l.setAttribute('x2',p.x-Math.sin(yaw)*o);l.setAttribute('y2',p.z-Math.cos(yaw)*o)}
/* ===== VR ===== */
const vig=new THREE.Mesh(new THREE.RingGeometry(.22,.7,32),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:0,depthTest:false,side:THREE.DoubleSide}));vig.position.z=-.3;vig.renderOrder=999;camera.add(vig);
const rc=new THREE.Raycaster(),tm=new THREE.Matrix4(),wp=new THREE.Vector3();
for(let i=0;i<2;i++){const c=renderer.xr.getController(i);c.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-6)]),new THREE.LineBasicMaterial({color:0xc9a66b})));
 c.addEventListener('selectstart',()=>{tm.identity().extractRotation(c.matrixWorld);rc.ray.origin.setFromMatrixPosition(c.matrixWorld);rc.ray.direction.set(0,0,-1).applyMatrix4(tm);
  const h=rc.intersectObjects(slabs.filter(s=>s.visible))[0];if(!h)return;camera.getWorldPosition(wp);rig.position.x+=h.point.x-wp.x;rig.position.z+=h.point.z-wp.z;rig.position.y=h.point.y+(S.seated?.5:0);if(S.vig)vig.material.opacity=.9});rig.add(c)}
renderer.xr.addEventListener('sessionstart',()=>{root.visible=true;panoMesh.visible=false;rig.position.set(-5,fy()+(S.seated?.5:0),15);rig.rotation.set(0,0,0)});
let lock=false;
function snapTurn(){const ss=renderer.xr.getSession();if(!ss)return;for(const s of ss.inputSources){const ax=s.gamepad&&s.gamepad.axes[2];if(ax==null)continue;if(Math.abs(ax)>.7&&!lock){lock=true;camera.getWorldPosition(wp);const p=wp.clone();rig.rotation.y-=Math.sign(ax)*S.snap*Math.PI/180;rig.updateMatrixWorld(true);camera.getWorldPosition(wp);rig.position.add(p.sub(wp));if(S.vig)vig.material.opacity=.9}else if(Math.abs(ax)<.3)lock=false}}
/* ===== Loop ===== */
function size(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',size);size();
let last=performance.now(),mt=0;
renderer.setAnimationLoop(()=>{const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;
 if(renderer.xr.isPresenting){snapTurn();vig.material.opacity=Math.max(0,vig.material.opacity-dt*1.5)}
 else{if(tw){let k=Math.min(1,(now-tw.s)/tw.ms);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;camera.position.lerpVectors(tw.p0,tw.p1,k);controls.target.lerpVectors(tw.t0,tw.t1,k);if(k>=1)tw=null}
  if(mode==='orbit')controls.update();else{if(mode==='walk'){const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),r=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);{const nx=camera.position.x+(-Math.sin(yaw)*f+Math.cos(yaw)*r)*dt*3,nz=camera.position.z+(-Math.cos(yaw)*f-Math.sin(yaw)*r)*dt*3;if(inside(cur<=0?SITE:FOOT,nx,nz)){camera.position.x=nx;camera.position.z=nz}}}else panoMesh.position.copy(camera.position);camera.rotation.set(-pitch,-yaw,0)}}
 if(now-mt>150){mt=now;drawMap()}
 renderer.render(scene,camera)});
sunUpdate();vis();go(...VIEW.aerial,1);ui();
</script></body></html>
